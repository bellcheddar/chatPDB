<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chatPDB — Protein Structure AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>">

  <!-- xterm.js -->
  <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d2620;
      color: #e6f3ee;
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* -- top bar -- */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: #12332c;
      border-bottom: 1px solid #1e453b;
      flex-shrink: 0;
    }
    header .logo { font-size: 1.1rem; font-weight: 600; color: #3ddbb0; letter-spacing: 0.04em; }
    header .sub  { font-size: 0.75rem; color: #7fb8a5; }
    header .dot  { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; margin-left: auto; }
    header .dot.connecting { background: #f0883e; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    /* -- terminal container -- */
    #terminal-container {
      flex: 1;
      padding: 8px;
      overflow: hidden;
    }

    #terminal {
      height: 100%;
    }

    /* -- footer -- */
    footer {
      padding: 4px 16px;
      background: #12332c;
      border-top: 1px solid #1e453b;
      font-size: 0.7rem;
      color: #5a8a78;
      display: flex;
      gap: 20px;
      flex-shrink: 0;
    }
    footer a { color: #3ddbb0; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* Overlay shown while connecting */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(13,38,32,0.85);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      z-index: 100;
      font-size: 0.9rem; color: #7fb8a5;
    }
    #overlay .spinner {
      width: 32px; height: 32px;
      border: 3px solid #1e453b;
      border-top-color: #3ddbb0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #overlay.hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <span class="logo">⬡ chatPDB</span>
    <span class="sub">32B · QLoRA · RAG</span>
    <span class="dot connecting" id="status-dot" title="Connecting..."></span>
  </header>

  <div id="terminal-container">
    <div id="terminal"></div>
  </div>

  <footer>
    <span>Marc C. Deller, D.Phil. ·
      <a href="https://marcdeller.com" target="_blank">marcdeller.com</a> ·
      <a href="https://github.com/bellcheddar/chatPDB" target="_blank">GitHub</a> ·
      <a href="https://huggingface.co/Dellboy" target="_blank">HuggingFace</a>
    </span>
    <span style="margin-left:auto">Type <code>/help</code> for commands</span>
  </footer>

  <div id="overlay">
    <div class="spinner"></div>
    <span>Starting chatPDB…</span>
  </div>

  <script>
    // -- xterm setup --
    const term = new Terminal({
      theme: {
        background:  '#0d2620',
        foreground:  '#e6f3ee',
        cursor:      '#3ddbb0',
        cursorAccent:'#0d2620',
        black:       '#5a8a78',
        red:         '#ff7b72',
        green:       '#3fb950',
        yellow:      '#d29922',
        blue:        '#58a6ff',
        magenta:     '#bc8cff',
        cyan:        '#39c5cf',
        white:       '#b1c4bc',
        brightBlack: '#7fb8a5',
        brightCyan:  '#3ddbb0',
      },
      fontFamily: "'Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace",
      fontSize: 14,
      lineHeight: 1.3,
      cursorBlink: true,
      scrollback: 5000,
      allowProposedApi: true,
    });

    const fitAddon      = new FitAddon.FitAddon();
    const webLinksAddon = new WebLinksAddon.WebLinksAddon();
    term.loadAddon(fitAddon);
    term.loadAddon(webLinksAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    window.addEventListener('resize', () => fitAddon.fit());

    // -- WebSocket --
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws    = new WebSocket(`${proto}//${location.host}/ws`);

    ws.onopen = () => {
      document.getElementById('overlay').classList.add('hidden');
      const dot = document.getElementById('status-dot');
      dot.classList.remove('connecting');
      dot.title = 'Connected';
      // Send an initial resize so the server-side PTY matches the real terminal size
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    };

    ws.onmessage = (e) => term.write(e.data);

    ws.onclose = () => {
      const dot = document.getElementById('status-dot');
      dot.style.background = '#f85149';
      dot.title = 'Disconnected';
      term.write('\r\n\r\n\x1b[31mSession ended. Refresh to reconnect.\x1b[0m\r\n');
    };

    ws.onerror = () => {
      document.getElementById('overlay').classList.add('hidden');
      term.write('\x1b[31mWebSocket error — check server logs.\x1b[0m\r\n');
    };

    // Forward keystrokes to server
    term.onData(data => { if (ws.readyState === WebSocket.OPEN) ws.send(data); });

    // Resize signal
    term.onResize(({ cols, rows }) => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'resize', cols, rows }));
      }
    });
  </script>
</body>
</html>
