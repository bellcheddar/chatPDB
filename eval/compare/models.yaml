# ============================================================
# chatPDB comparative eval — model registry
# ============================================================
# All paths are relative to the chatPDB project root.
# Val loss curves are [true_iter, val_loss] pairs, pulled directly from the real W&B history
# (project "chatpdb", runs 390dnfgb + wpv76v0y) and combined using the true-iter offset
# convention documented in PROJECT_PLAN.md / feedback_iter_offset (resumed run's own step counter
# restarts from 1 -> true_iter = step + 600, the iter of the checkpoint it resumed from).
#
# Starts with a single entry (chatPDB has shipped one round so far) — add a new `- id: ...` block
# per future round, matching the top-level README's append-only Models/Training table convention.
# ============================================================

settings:
  n_examples: 100
  test_file: data/sft/test.jsonl
  port: 8080
  sample_seed: 42
  baseline: chatpdb_32b_v1
  server_startup_timeout: 600   # seconds to wait for model to load (32B needs 3-5 min)
  query_timeout: 120

# ─── model definitions ────────────────────────────────────────

models:
  - id: chatpdb_32b_v1
    display_name: "Round 1 (32B v1)"
    subtitle: "First fine-tune · Qwen3-32B-4bit"
    path: models/chatpdb_32b_v1
    color: "#467FF7"
    is_baseline: true
    # Architecture
    base_model: "Qwen3-32B-4bit"
    lora_type: "RSLoRA"
    lora_rank: 32
    lora_scale: 64.0
    adapted_layers: 32
    total_layers: 64
    # Training (real values from config/train_config.yaml + real W&B history)
    batch_size: 4
    learning_rate: "2.0e-5"
    lr_schedule: "cosine_decay + 100-step warmup"
    seed: 51
    iters_configured: 1420
    iters_actual: 800
    iters_note: "early stop (Marc: 'stop the run') — real val-loss plateau since ~iter 300; crashed once at true iter ~630, resumed from the true-iter-600 checkpoint (weights-only resume, see feedback_iter_offset)"
    best_val_loss: 0.176
    best_val_iter: 600
    fused_checkpoint_iter: 600
    final_train_loss: 0.281
    training_examples: 77818
    peak_memory_gb: 27.9
    fused_size_gb: 18.4
